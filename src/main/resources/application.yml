spring:
  application:
    name: pos
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${user.home}/LocalMartPOS/database/localmart-pos.db

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
      cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  address: 0.0.0.0
  port: 8080
  ssl:
    enabled: true
    key-store: file:${user.home}/LocalMartPOS/certs/pos-https.p12
    key-store-type: PKCS12
    key-store-password: localmart
    key-alias: pos
