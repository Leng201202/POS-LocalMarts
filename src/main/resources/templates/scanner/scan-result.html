<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>LocalMart Scanner - Scan Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link th:href="@{/scanner/scanner.css}" rel="stylesheet">
</head>

<body>

<div class="scanner-app">

    <!-- ================= HEADER ================= -->

    <header class="scanner-header">

        <div class="scanner-header-title">
            <i class="bi bi-upc-scan me-2"></i>
            LocalMart Scanner
        </div>

        <div class="scanner-terminal">
            Terminal: <strong th:text="${terminalId}">POS-01</strong>
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="scanner-main">

        <!-- Product found -->

        <div th:if="${product}" class="product-card">

            <i class="bi bi-check-circle-fill product-card-icon"></i>

            <div class="product-name" th:text="${product.name}">Product Name</div>

            <div class="product-price"
                 th:text="'$' + ${#numbers.formatDecimal(product.sellingPrice, 1, 2)}">$0.00</div>

            <div class="product-meta">

                <div class="product-meta-row">
                    <span>Barcode</span>
                    <span th:text="${barcode}">000000000000</span>
                </div>

                <div class="product-meta-row">
                    <span>In Stock</span>
                    <span th:text="${product.stockQuantity}">0</span>
                </div>

                <div class="product-meta-row" th:if="${product.category}">
                    <span>Category</span>
                    <span th:text="${product.category.name}">-</span>
                </div>

                <div class="product-meta-row" th:if="${product.unit}">
                    <span>Unit</span>
                    <span th:text="${product.unit.name}">-</span>
                </div>

            </div>

        </div>


        <!-- Product not found -->

        <div th:if="${productNotFound}" class="not-found-card">
            <i class="bi bi-exclamation-triangle-fill fs-1 mb-2"></i>
            <p class="mb-1">No product found for this barcode</p>
            <div class="not-found-barcode" th:text="${barcode}">000000000000</div>
        </div>


        <!-- Controls -->

        <a th:href="@{/scanner/join/{token}(token=${token})}"
           class="btn btn-primary btn-lg scan-next-btn">
            <i class="bi bi-upc-scan me-2"></i>
            Scan Next Item
        </a>

    </main>

</div>

</body>
</html>
