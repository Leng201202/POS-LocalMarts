<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Customer | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body class="bg-light" th:classappend="${isAdmin} ? ' admin-body' : ' admin-body cashier-body'">
<th:block th:if="${isAdmin}">
    <th:block th:replace="~{admin/fragments/navigation :: shell('customers')}"></th:block>
</th:block>
<th:block th:unless="${isAdmin}">
    <th:block th:replace="~{cashier/fragments/navigation :: shell('customers')}"></th:block>
</th:block>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold"
           th:href="${dashboardUrl}">

            <i class="bi bi-shop me-1"></i>
            LocalMart POS
        </a>

        <div class="ms-auto">

            <a th:href="@{/customer}"
               class="btn btn-outline-secondary btn-sm">

                <i class="bi bi-arrow-left me-1"></i>
                Back to Customers
            </a>

        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-xl-6">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white py-3">

                    <h4 class="fw-bold mb-1">

                        <i class="bi bi-pencil-square text-primary me-1"></i>
                        Edit Customer
                    </h4>

                    <p class="text-muted mb-0">
                        Update the customer's name and phone number.
                    </p>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/customer/{id}/edit(id=${customer.id})}"
                          th:object="${customer}"
                          method="post">

                        <!-- Name -->
                        <div class="mb-3">

                            <label for="name"
                                   class="form-label fw-semibold">

                                Customer Name
                                <span class="text-danger">*</span>
                            </label>

                            <input id="name"
                                   type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')}
                                        ? 'is-invalid'"
                                   maxlength="100"
                                   placeholder="Enter customer name"
                                   required>

                            <div class="invalid-feedback"
                                 th:errors="*{name}">
                            </div>

                        </div>

                        <!-- Phone Number -->
                        <div class="mb-4">

                            <label for="phoneNumber"
                                   class="form-label fw-semibold">

                                Phone Number
                                <span class="text-danger">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-telephone"></i>
                                </span>

                                <input id="phoneNumber"
                                       type="tel"
                                       class="form-control"
                                       th:field="*{phoneNumber}"
                                       th:classappend="${#fields.hasErrors('phoneNumber')}
                                            ? 'is-invalid'"
                                       maxlength="20"
                                       placeholder="Example: 0812345678"
                                       required>

                                <div class="invalid-feedback"
                                     th:errors="*{phoneNumber}">
                                </div>

                            </div>

                            <div class="form-text">
                                This phone number is used to find the member
                                during checkout.
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/customer}"
                               class="btn btn-outline-secondary">

                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-save me-1"></i>
                                Update Customer
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
