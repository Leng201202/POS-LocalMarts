<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Reset Password</h2>
        <p class="text-muted mb-0">Update user password here.</p> 
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <form th:action="@{/users/reset-password/{id}(id=${user.id})}"
                th:object="${resetPasswordRequest}"
                method="post">

                <div class="alert alert-danger"
                        th:if="${#fields.hasErrors('*')}"
                        th:errors="*{*}">
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password"
                           th:field="*{newPassword}"
                           class="form-control"
                           required>
                </div>
            
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password"
                           th:field="*{confirmPassword}"
                           class="form-control"
                           required>
                </div>


                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save me-1"></i> Save Changes
                    </button>

                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
                        
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
