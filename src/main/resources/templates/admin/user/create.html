<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create User | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body class="admin-body">
<th:block th:replace="~{admin/fragments/navigation :: shell('users')}"></th:block>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Users
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Add New User</h2>
        <p class="text-muted mb-0">Create an account for an administrator or cashier.</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">User Information</h5>
        </div>

        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                Username already exists.
            </div>

            <form th:action="@{/users/save}" method="post" th:object="${user}">

                <div class="mb-3">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text"
                           th:field="*{fullName}"
                           class="form-control"
                           placeholder="Example: Jane Cashier"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text"
                           th:field="*{username}"
                           class="form-control"
                           placeholder="Example: jane"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Role <span class="text-danger">*</span></label>
                    <select th:field="*{role}" class="form-select" required>
                        <option value="">Select role</option>
                        <option th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}">
                            ADMIN
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i> Save User
                    </button>

                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
