<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body class="admin-body">
<th:block th:replace="~{admin/fragments/navigation :: shell('users')}"></th:block>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="${dashboardUrl}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">User Management</h2>
            <p class="text-muted mb-0">Manage administrator and cashier access.</p>
        </div>

        <div class="d-flex gap-2">

            <a th:href="@{/users/create}" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Add User
            </a>
        </div>
    </div>
    

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            
             
            <div class="mt-2">
                <a th:href="@{/users}" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-person-check me-1"></i> Active Users
                </a>
            <a th:href="@{/users/inactive}" class="btn btn-outline-secondary">
                <i class="bi bi-person-x me-1"></i> Inactive Users
            </a>
        </div>


        <div class="card-body">

            <div class="alert alert-success alert-dismissible fade show"
                role="alert"
                th:if="${successMessage}">

                <span th:text="${successMessage}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>
            </div>
            
            <div th:if="${#lists.isEmpty(users)}" class="alert alert-info mb-0">
                No active users found.
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div th:if="${!#lists.isEmpty(users)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td class="fw-semibold" th:text="${user.fullName}">System Administrator</td>
                        <td th:text="${user.username}">admin</td>
                        <td>
                            <span class="badge text-bg-primary" th:text="${user.role}">ADMIN</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <span th:if="${user.active}" class="badge text-bg-success">Active</span>
                            <span th:if="${!user.active}" class="badge text-bg-danger">Inactive</span>
                        </td>
    
                        <td class="text-end">
                            <a th:href="@{/users/edit/{id}(id=${user.id})}"
                            class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil-square"></i> Edit 
                            </a>

                            <a th:href="@{/users/reset-password/{id}(id=${user.id})}"
                            class="btn btn-warning btn-sm">
                                Reset Password
                            </a>

                            <form 
                                th:action="@{/users/deactivate/{id}(id=${user.id})}"
                                method="post"
                                class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deactivate this user?')">
                                    <i class="bi bi-person-x"></i> Deactivate
                                </button>
                            </form>
                        </td>               
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
