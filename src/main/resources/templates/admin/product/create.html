<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Product | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <a th:href="@{/products}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Products
        </a>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Add New Product</h2>
        <p class="text-muted mb-0">
            Enter product information.
        </p>
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <form th:action="@{/products/create}"
                  method="post"
                  th:object="${product}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Barcode</label>
                        <input type="text"
                               th:field="*{barcode}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Size</label>
                        <input type="text"
                               th:field="*{size}"
                               class="form-control"
                               placeholder="Example: 500 ml">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Category</label>
                        <select th:field="*{category}"
                                class="form-select"
                                required>

                            <option value="">Select category</option>

                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Unit</label>
                        <select th:field="*{unit}"
                                class="form-select"
                                required>

                            <option value="">Select unit</option>

                            <option th:each="unit : ${units}"
                                    th:value="${unit.id}"
                                    th:text="${unit.name}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Cost Price</label>
                        <input type="number"
                               th:field="*{costPrice}"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Selling Price</label>
                        <input type="number"
                               th:field="*{sellingPrice}"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Discount Percent</label>
                        <input type="number"
                               th:field="*{discountPercent}"
                               class="form-control"
                               min="0"
                               max="100"
                               step="0.01">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Initial Stock</label>
                        <input type="number"
                               th:field="*{stockQuantity}"
                               class="form-control"
                               min="0"
                               value="0">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Minimum Stock</label>
                        <input type="number"
                               th:field="*{minimumStock}"
                               class="form-control"
                               min="0"
                               value="0">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Manufacturing Date
                        </label>
                        <input type="date"
                               th:field="*{mfd}"
                               class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Expiry Date
                        </label>
                        <input type="date"
                               th:field="*{exp}"
                               class="form-control">
                    </div>

                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>
                        Save Product
                    </button>

                    <a th:href="@{/products}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
