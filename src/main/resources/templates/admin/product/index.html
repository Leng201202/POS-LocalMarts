<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Product Management | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Product Management</h2>
            <p class="text-muted mb-0">
                View and manage products.
            </p>
        </div>

        <a th:href="@{/products/create}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Add Product
        </a>
    </div>

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Product List</h5>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(products)}"
                 class="alert alert-info mb-0">
                No products found.
            </div>

            <div th:if="${!#lists.isEmpty(products)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Barcode</th>
                        <th>Category</th>
                        <th>Size</th>
                        <th>Unit</th>
                        <th>Selling Price</th>
                        <th>Discount</th>
                        <th>Stock</th>
                        <th>Minimum</th>
                        <th>MFD</th>
                        <th>EXP</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="product : ${products}">

                        <td th:text="${product.id}">1</td>

                        <td class="fw-semibold"
                            th:text="${product.name}">
                            Coca-Cola
                        </td>

                        <td th:text="${product.barcode}">
                            8851234567890
                        </td>

                        <td th:text="${product.category != null
                            ? product.category.name
                            : '-'}">
                            Drinks
                        </td>

                        <td th:text="${product.size}">
                            500 ml
                        </td>

                        <td th:text="${product.unit != null
                            ? product.unit.name
                            : '-'}">
                            Bottle
                        </td>

                        <td th:text="${product.sellingPrice}">
                            25.00
                        </td>

                        <td th:text="${(product.discountPercent != null
                            ? product.discountPercent.stripTrailingZeros().toPlainString()
                            : '0') + '%'}">
                            0%
                        </td>

                        <td>
                            <span th:text="${product.stockQuantity}">
                                20
                            </span>
                        </td>

                        <td th:text="${product.minimumStock}">
                            5
                        </td>

                        <td th:text="${product.mfd != null
                            ? #temporals.format(product.mfd, 'yyyy-MM-dd')
                            : '-'}">
                            2026-01-01
                        </td>

                        <td th:text="${product.exp != null
                            ? #temporals.format(product.exp, 'yyyy-MM-dd')
                            : '-'}">
                            2027-01-01
                        </td>

                        <td class="text-end">

                            <a th:href="@{/products/edit/{id}(id=${product.id})}"
                               class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil-square"></i> Edit
                            </a>

                            <form sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/products/delete/{id}(id=${product.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Delete this product?')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>

                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
