<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unit Management | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Unit Management</h2>
            <p class="text-muted mb-0">View, edit, and delete measurement units.</p>
        </div>

        <a th:href="@{/admin/unit/create}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Add Unit
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Unit List</h5>
        </div>

        <div class="card-body">
            <div th:if="${#lists.isEmpty(units)}" class="alert alert-info mb-0">
                No units found. Click <strong>Add Unit</strong> to create one.
            </div>

            <div th:if="${!#lists.isEmpty(units)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Unit Name</th>
                        <th>Abbreviation</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="u : ${units}">
                        <td th:text="${u.id}">1</td>
                        <td class="fw-semibold" th:text="${u.name}">Piece</td>
                        <td>
                            <span class="badge text-bg-secondary" th:text="${u.abbreviation}">pcs</span>
                        </td>

                        <td class="text-end">
                            <button type="button"
                                    class="btn btn-sm btn-outline-warning"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editUnitModal' + ${u.id}">
                                <i class="bi bi-pencil-square"></i> Edit
                            </button>

                            <form th:action="@{/admin/unit/delete/{id}(id=${u.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Delete this unit?')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- Edit Unit Modals -->
<div th:each="u : ${units}">
    <div class="modal fade" th:id="'editUnitModal' + ${u.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form th:action="@{/admin/unit/update/{id}(id=${u.id})}" method="post" class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Unit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Unit Name</label>
                        <input type="text" name="name" class="form-control" th:value="${u.name}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Abbreviation</label>
                        <input type="text" name="abbreviation" class="form-control" th:value="${u.abbreviation}" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning">Update Unit</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
