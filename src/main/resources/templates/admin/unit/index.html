<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Management | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>

    </div>
</nav>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">Unit Management</h2>
            <p class="text-muted mb-0">
                Manage product measurement units for the POS system.
            </p>
        </div>

        <a th:href="@{/unit/create}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Add Unit
        </a>

    </div>

    <div class="card border-0 shadow-sm">

        <div class="card-header bg-white">
            <h5 class="mb-0">
                Unit List
            </h5>
        </div>

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Unit Name</th>
                    <th>Abbreviation</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(units)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No units found.
                    </td>
                </tr>

                <tr th:each="unit, iter : ${units}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${unit.name}"></td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${unit.abbreviation}"></span>
                    </td>
                    <td>
                        <span th:if="${unit.active}"
                              class="badge bg-success">
                            Active
                        </span>
                        <span th:unless="${unit.active}"
                              class="badge bg-secondary">
                            Inactive
                        </span>
                    </td>
                    <td th:text="${#temporals.format(unit.created_at,'dd MMM yyyy HH:mm')}"></td>
                    <td class="text-end">
                        <a th:href="@{/unit/edit/{id}(id=${unit.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button
                                class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteModal"
                                th:data-id="${unit.id}"
                                th:data-name="${unit.name}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade"
     id="deleteModal"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Delete Unit
                </h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete
                <strong id="unitName"></strong>?
                <br><br>
                This action <b>cannot</b> be restored later.
            </div>
            <div class="modal-footer">
                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <form id="deleteForm" method="post">
                    <button class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

<script>
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        document.getElementById('unitName').textContent = name;
        document.getElementById('deleteForm').action =
            '/unit/delete/' + id;
    });
</script>
</html>
