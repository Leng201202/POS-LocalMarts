<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Unit | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="@{/admin/unit}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Units
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Add New Unit</h2>
        <p class="text-muted mb-0">Create a new measurement unit for products.</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Unit Information</h5>
        </div>

        <div class="card-body">
            <form th:action="@{/admin/unit/save}" method="post" th:object="${unit}">

                <div class="mb-3">
                    <label class="form-label">Unit Name <span class="text-danger">*</span></label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Example: Piece"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Abbreviation <span class="text-danger">*</span></label>
                    <input type="text"
                           th:field="*{abbreviation}"
                           class="form-control"
                           placeholder="Example: pcs"
                           required>
                </div>

                <div class="alert alert-light border">
                    <strong>Examples:</strong>
                    Piece / pcs, Bottle / btl, Pack / pack, Box / box, Kilogram / kg, Liter / L
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i> Save Unit
                    </button>

                    <a th:href="@{/admin/unit}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
