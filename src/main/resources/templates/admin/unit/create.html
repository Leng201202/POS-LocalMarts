<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Unit | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body class="admin-body">
<th:block th:replace="~{admin/fragments/navigation :: shell('units')}"></th:block>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            LocalMart POS
        </a>

        <div class="ms-auto">
            <a th:href="@{/unit}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
                Back to Units
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Create Unit</h2>
        <p class="text-muted mb-0">
            Add a new measurement unit for products in the POS system.
        </p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">
                <i class="bi bi-rulers me-2"></i>
                Unit Information
            </h5>
        </div>

        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>
            <form th:action="@{/unit/create}"
                  th:object="${unit}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Unit Name <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Example: Piece, Bottle, Kilogram"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Abbreviation <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           th:field="*{abbreviation}"
                           class="form-control"
                           placeholder="Example: pcs, btl, kg"
                           required>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           role="switch"
                           th:field="*{active}">
                    <label class="form-check-label">
                        Active unit
                    </label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/unit}" class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>
                        Save Unit
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
