<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="shell(active)">
    <div class="admin-nav-scrim" data-admin-nav-close></div>

    <aside class="admin-sidebar" aria-label="Admin navigation">
        <div class="admin-brand">
            <span class="admin-brand-mark"><i class="bi bi-shop-window"></i></span>
            <span>
                <strong>LocalMart</strong>
                <small>Admin workspace</small>
            </span>
            <button class="admin-sidebar-close" type="button" aria-label="Close navigation" data-admin-nav-close>
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <nav class="admin-nav">
            <span class="admin-nav-label">Overview</span>
            <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? ' active'">
                <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
            </a>

            <span class="admin-nav-label">Operations</span>
            <a th:href="@{/inventory}" th:classappend="${active == 'inventory'} ? ' active'">
                <i class="bi bi-boxes"></i><span>Inventory</span>
            </a>
            <a th:href="@{/customer}" th:classappend="${active == 'customers'} ? ' active'">
                <i class="bi bi-person-heart"></i><span>Customers</span>
            </a>

            <span class="admin-nav-label">Catalog</span>
            <a th:href="@{/products}" th:classappend="${active == 'products'} ? ' active'">
                <i class="bi bi-box-seam"></i><span>Products</span>
            </a>
            <a th:href="@{/category}" th:classappend="${active == 'categories'} ? ' active'">
                <i class="bi bi-tags"></i><span>Categories</span>
            </a>
            <a th:href="@{/unit}" th:classappend="${active == 'units'} ? ' active'">
                <i class="bi bi-rulers"></i><span>Units</span>
            </a>

            <span class="admin-nav-label">Engagement</span>
            <a th:href="@{/loyalty-config}" th:classappend="${active == 'loyalty-config'} ? ' active'">
                <i class="bi bi-stars"></i><span>Loyalty settings</span>
            </a>
            <a th:href="@{/loyalty}" th:classappend="${active == 'loyalty'} ? ' active'">
                <i class="bi bi-arrow-left-right"></i><span>Loyalty activity</span>
            </a>

            <span class="admin-nav-label">Administration</span>
            <a th:href="@{/users}" th:classappend="${active == 'users'} ? ' active'">
                <i class="bi bi-people"></i><span>Users</span>
            </a>
            <a th:href="@{/audit}" th:classappend="${active == 'audit'} ? ' active'">
                <i class="bi bi-shield-check"></i><span>Audit log</span>
            </a>
            <a th:href="@{/admin/report}" th:classappend="${active == 'reports'} ? ' active'">
                <i class="bi bi-bar-chart-line"></i><span>Reports</span>
            </a>
        </nav>

        <div class="admin-sidebar-footer">
            <div class="admin-role">
                <span class="admin-role-icon"><i class="bi bi-person-check"></i></span>
                <span><small>Signed in as</small><strong>Administrator</strong></span>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="admin-logout" aria-label="Log out" title="Log out">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </aside>

    <header class="admin-mobile-bar">
        <button type="button" class="admin-menu-button" aria-label="Open navigation" data-admin-nav-open>
            <i class="bi bi-list"></i>
        </button>
        <a th:href="@{/admin}" class="admin-mobile-brand">
            <span class="admin-brand-mark"><i class="bi bi-shop-window"></i></span>
            <strong>LocalMart</strong>
        </a>
        <span class="admin-mobile-role">Admin</span>
    </header>

    <script th:src="@{/js/admin-shell.js}" defer></script>
</th:block>
</body>
</html>
