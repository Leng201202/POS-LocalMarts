<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Analysis | LocalMart POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom shadow-sm"><div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" th:href="@{/admin}">LocalMart POS</a>
    <div class="d-flex gap-2"><a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/report/sales(start=${start},end=${end})}">Sales</a><a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/report/profit(start=${start},end=${end})}">Profit</a><a class="btn btn-warning btn-sm" th:href="@{/admin/report/payment(start=${start},end=${end})}">Payment</a><a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/report}">Reports</a></div>
</div></nav>
<main class="container-fluid px-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h2 class="fw-bold mb-1">Payment Analysis</h2><p class="text-muted mb-0">Completed sale amounts by payment type from <strong th:text="${start}">start</strong> to <strong th:text="${end}">end</strong>.</p></div><div class="d-flex gap-2"><a class="btn btn-success" th:href="@{/admin/report/export(start=${start},end=${end},format='xlsx')}"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel</a><a class="btn btn-danger" th:href="@{/admin/report/export(start=${start},end=${end},format='pdf')}"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a></div></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body"><form class="row g-3 align-items-end" th:action="@{/admin/report/payment}" method="get">
        <div class="col-md-4"><label class="form-label fw-semibold" for="start">Start date</label><input class="form-control" id="start" name="start" type="date" th:value="${start}" required></div>
        <div class="col-md-4"><label class="form-label fw-semibold" for="end">End date</label><input class="form-control" id="end" name="end" type="date" th:value="${end}" required></div>
        <div class="col-md-4"><button class="btn btn-primary w-100" type="submit">Generate report</button></div>
    </form></div></div>
    <div class="row g-4">
        <div class="col-lg-4"><div class="card border-0 shadow-sm h-100"><div class="card-body"><p class="text-muted mb-1">Total Sale Amount</p><h2 class="fw-bold text-primary" th:text="|฿${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}|">฿0.00</h2><p class="text-muted mb-0" th:text="|${#lists.size(payments)} payment types used|">0 payment types used</p></div></div></div>
        <div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-header bg-white py-3"><h5 class="mb-0">Payment Method Breakdown</h5></div><div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Payment Type</th><th class="text-end">Sale Amount</th><th style="width:38%">Percentage</th></tr></thead>
            <tbody>
            <tr th:each="payment : ${payments}"><td class="fw-semibold" th:text="${payment.paymentType}">CASH</td><td class="text-end" th:text="|฿${#numbers.formatDecimal(payment.amount,1,'COMMA',2,'POINT')}|">฿0.00</td><td><div class="d-flex align-items-center gap-2"><div class="progress flex-grow-1" style="height:10px"><div class="progress-bar" th:style="|width:${payment.percentage}%|" th:aria-label="|${payment.paymentType} percentage|"></div></div><span class="text-nowrap" th:text="|${#numbers.formatDecimal(payment.percentage,1,2)}%|">0.00%</span></div></td></tr>
            <tr th:if="${#lists.isEmpty(payments)}"><td colspan="3" class="text-center text-muted py-4">No completed sales in this period.</td></tr>
            </tbody>
        </table></div></div></div>
    </div>
</main>
</body>
</html>
