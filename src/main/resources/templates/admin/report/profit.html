<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profit Report | LocalMart POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar bg-white border-bottom shadow-sm">

    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold"
           th:href="@{/admin}">
            LocalMart POS
        </a>


        <a th:href="@{/admin/report}"
           class="btn btn-outline-secondary btn-sm">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Reports

        </a>

    </div>

</nav>



<!-- CONTENT -->

<div class="container-fluid px-4 py-4">


    <!-- HEADER -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Profit Report
            </h2>

            <p class="text-muted mb-0">
                Analyze revenue, cost and gross profit.
            </p>

        </div>

    </div>



    <!-- ========================= -->
    <!-- DATE FILTER -->
    <!-- ========================= -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <form th:action="@{/admin/report/profit}"
                  method="get"
                  class="row g-3 align-items-end">


                <!-- START DATE -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        Start Date
                    </label>

                    <input type="date"
                           name="start"
                           class="form-control"
                           th:value="${start}"
                           required>

                </div>



                <!-- END DATE -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        End Date
                    </label>

                    <input type="date"
                           name="end"
                           class="form-control"
                           th:value="${end}"
                           required>

                </div>



                <!-- BUTTON -->

                <div class="col-md-4">

                    <button type="submit"
                            class="btn btn-primary w-100">

                        <i class="bi bi-search me-1"></i>

                        Generate Report

                    </button>

                </div>


            </form>

        </div>

    </div>



    <!-- ========================= -->
    <!-- REPORT PERIOD -->
    <!-- ========================= -->

    <div class="mb-3">

        <span class="text-muted">
            Report Period:
        </span>

        <span class="fw-semibold"
              th:text="${start}">
            2026-10-01
        </span>

        <span class="mx-1">
            -
        </span>

        <span class="fw-semibold"
              th:text="${end}">
            2026-10-05
        </span>

    </div>



    <!-- ========================= -->
    <!-- PROFIT SUMMARY -->
    <!-- ========================= -->

    <div class="row g-4">


        <!-- TOTAL REVENUE -->

        <div class="col-lg-4 col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-start">


                        <div>

                            <p class="text-muted mb-2">
                                Total Revenue
                            </p>


                            <h3 class="fw-bold mb-0">

                                ฿<span th:text="${#numbers.formatDecimal(
                                        summary.totalRevenue,
                                        1,
                                        'COMMA',
                                        2,
                                        'POINT'
                                )}">
                                    0.00
                                </span>

                            </h3>

                        </div>


                        <div class="fs-2 text-primary">

                            <i class="bi bi-cash-stack"></i>

                        </div>


                    </div>

                </div>

            </div>

        </div>



        <!-- COST OF GOODS SOLD -->

        <div class="col-lg-4 col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-start">


                        <div>

                            <p class="text-muted mb-2">
                                Cost of Goods Sold
                            </p>


                            <h3 class="fw-bold mb-0">

                                ฿<span th:text="${#numbers.formatDecimal(
                                        summary.costOfGoodsSold,
                                        1,
                                        'COMMA',
                                        2,
                                        'POINT'
                                )}">
                                    0.00
                                </span>

                            </h3>

                        </div>


                        <div class="fs-2 text-danger">

                            <i class="bi bi-box-seam"></i>

                        </div>


                    </div>

                </div>

            </div>

        </div>



        <!-- GROSS PROFIT -->

        <div class="col-lg-4 col-md-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-start">


                        <div>

                            <p class="text-muted mb-2">
                                Gross Profit
                            </p>


                            <h3 class="fw-bold text-success mb-0">

                                ฿<span th:text="${#numbers.formatDecimal(
                                        summary.grossProfit,
                                        1,
                                        'COMMA',
                                        2,
                                        'POINT'
                                )}">
                                    0.00
                                </span>

                            </h3>

                        </div>


                        <div class="fs-2 text-success">

                            <i class="bi bi-graph-up-arrow"></i>

                        </div>


                    </div>

                </div>

            </div>

        </div>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
